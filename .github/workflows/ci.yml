name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Import smoke
        # a missing module must fail the build, not fail silently at runtime
        run: python -c "import clickfix, cf.server, cf.report, cf.techniques, cf.stager"
      - name: Tests
        run: pytest -q
